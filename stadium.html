     옛날 그림 그대로다. 그림을 바꿔야 할 때는 내용만 갈아끼우지 말고 파일명을
     og-image-v2.png 처럼 올릴 것. 옛 파일도 남겨둔다(이미 퍼진 링크가 깨지지 않도록). -->

<body class="map-page">

<div class="map-shell">

  <!-- 지도가 화면 전부다. 목록·탭을 앞에 세우지 않는다. -->
  <div id="seat-map" aria-label="좌석 지도"></div>

  <header class="map-top">
    <div class="row">
      <a class="back" href="./" aria-label="홈으로">‹</a>
      <div class="name" id="stadium-name">불러오는 중…</div>
      <button class="wx" id="wx-chip" type="button">날씨 확인</button>
    </div>
  </header>

  <div class="rank-bar" id="rank-bar" hidden></div>

  <div class="map-controls">
    <button class="ghost" id="side-btn" type="button">🏠 홈 팬</button>
    <button class="ghost" id="reset-btn" type="button">⤢ 전체보기</button>
    <button id="rec-btn" type="button">🎯 맞춤 추천</button>
    <button class="ghost" id="report-btn" type="button">📍 정보 제보</button>
  </div>

  <div class="legend" id="legend">
    <b>좌석 정보 신뢰도</b>
    <div><span class="sw sw-v"></span>확인됨</div>
    <div><span class="sw sw-c"></span>확인 중 (여러 곳 일치)</div>
    <div><span class="sw sw-u"></span>위치 미확인</div>
  </div>

  <!-- 구역을 누르면 올라오는 시트 -->
  <section class="sheet" id="sheet" data-open="false" aria-live="polite">
    <div class="grab"></div>
    <button class="close" id="sheet-close" type="button" aria-label="닫기">✕</button>
    <div class="inner" id="sheet-body"></div>
  </section>

</div>

<script src="js/config.js"></script>
<script src="js/analytics.js"></script>
<script src="js/services/dataService.js"></script>

<script src="js/ui/shareCard.js"></script>
<script src="js/ui/report.js"></script>
<script src="js/stadium.js"></script>
<!-- 서비스 워커 — 야구장에서 네트워크가 안 터져도 한 번 본 화면과 구장 데이터가 열린다.
     날씨는 캐시하지 않는다(오래된 날씨를 지금 날씨처럼 보여주지 않는다).
     등록에 실패해도 앱은 평소대로 동작한다. -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* 없어도 그만 */ });
    });
  }
</script>
</body>
</html>
