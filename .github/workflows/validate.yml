name: 데이터 검사

# 왜 CI에서 도는가
#   이 서비스의 내용은 전부 data/*.json에 사람이 손으로 넣는다. 손으로 넣는 곳에서는
#   반드시 실수가 나고, 앱은 잘못된 값을 만나도 조용히 빈 화면을 낸다.
#   그래서 합치기 전에 여기서 막는다.

on:
  push:
    branches: [main]
    paths: ['data/**', 'js/**', 'scripts/**', 'worker/**', '.github/workflows/validate.yml']
  pull_request:
    paths: ['data/**', 'js/**', 'scripts/**', 'worker/**', '.github/workflows/validate.yml']
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 데이터 검사
        run: node scripts/validate-data.mjs

      - name: 추천 알고리즘 테스트
        run: node scripts/test-recommend.mjs

      # 중계기는 KBO에 직접 물어봐야 확인되지만, 받은 표를 옮기는 부분은
      # 그것 없이도 시험할 수 있다. KBO가 표를 바꾸면 여기가 먼저 빨개진다.
      - name: 일정 중계기 표 읽기 테스트
        run: node scripts/test-worker.mjs

      # 일정 받기는 아무도 안 볼 때 돌면서 저장소에 커밋한다.
      # KBO 없이 확인할 수 있는 것은 전부 여기서 막는다.
      - name: 일정 받기 테스트
        run: node scripts/test-fetch-games.mjs
